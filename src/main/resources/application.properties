spring.application.name=peach

# Database: local H2 by default, Neon when the env vars are set (Render)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:C:/Users/2742718/currentdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# No driverClassName or dialect: Spring and Hibernate work them out from the URL

spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never

# Keep the connection pool small for the free tiers
spring.datasource.hikari.maximum-pool-size=5

# H2 console only when running locally
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

server.port=${PORT:8080}
server.error.include-stacktrace=${ERROR_STACKTRACE:always}

# Comma-separated list of sites allowed to call the API
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5500,http://127.0.0.1:5500}

