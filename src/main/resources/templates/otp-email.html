<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light only">
    <title>Your Peach code</title>
</head>
<body style="margin:0;padding:0;background-color:#ffffff;font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;">
<!-- Inbox preview text -->
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">
    {{CODE}} is your Peach code. It expires in {{MINUTES}} minutes.
</div>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#ffffff;">
    <tr>
        <td align="center" style="padding:56px 24px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:420px;">

                <!-- Wordmark -->
                <tr>
                    <td style="padding-bottom:40px;">
                        <span style="font-family:Georgia,'Times New Roman',serif;font-size:20px;font-weight:600;letter-spacing:-0.3px;color:#1d1215;vertical-align:middle;">🍑peach</span>
                    </td>
                </tr>

                <!-- Heading -->
                <tr>
                    <td style="font-size:22px;font-weight:600;line-height:1.3;letter-spacing:-0.3px;color:#1d1215;">
                        Your verification code
                    </td>
                </tr>
                <tr>
                    <td style="padding-top:10px;font-size:15px;line-height:1.6;color:#6b5e5a;">
                        Enter this code to finish creating your account.
                    </td>
                </tr>

                <!-- Code -->
                <tr>
                    <td style="padding:36px 0 8px;font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace;font-size:40px;font-weight:600;letter-spacing:10px;color:#1d1215;">
                        {{CODE}}
                    </td>
                </tr>
                <tr>
                    <td style="padding-bottom:36px;font-size:13px;color:#9a8c88;">
                        Expires in {{MINUTES}} minutes
                    </td>
                </tr>

                <!-- Divider -->
                <tr>
                    <td style="border-top:1px solid #eeeeee;font-size:0;line-height:0;">&nbsp;</td>
                </tr>

                <!-- Footer -->
                <tr>
                    <td style="padding-top:24px;font-size:13px;line-height:1.6;color:#9a8c88;">
                        Sent to {{EMAIL}}. If you didn't request this, you can ignore this email.
                    </td>
                </tr>
                <tr>
                    <td style="padding-top:16px;font-size:12px;color:#c4b8b4;">
                        &copy; {{YEAR}} Peach
                    </td>
                </tr>

            </table>
        </td>
    </tr>
</table>
</body>
</html>
